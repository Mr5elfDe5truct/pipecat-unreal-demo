[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=(A=256407855,B=508023718,C=-715699576,D=-1385366904)
ProjectName=Pipecat Demo

[/Script/PipecatDemo.PipecatDemoSubsystem]
; The bot's start endpoint. -PipecatStartUrl=... on the command line overrides it.
StartUrl="http://localhost:7860/start"

[/Script/PipecatDemo.PipecatWorld]
; The plants that grow on the ground. The trees are the engine's PCG biome
; sample's, and there's no grass mesh, so grass only colors the ground. For a
; more realistic look, use others, e.g. from Fab, like:
; +GrassMeshes=/Game/Path/To/SM_Grass.SM_Grass
+TreeMeshes=/PCGBiomeSample/Meshes/PCG_Tree_01.PCG_Tree_01
+TreeMeshes=/PCGBiomeSample/Meshes/PCG_Tree_02.PCG_Tree_02
+TreeMeshes=/PCGBiomeSample/Meshes/PCG_Pine_01.PCG_Pine_01
+TreeMeshes=/PCGBiomeSample/Meshes/PCG_Spruce_01.PCG_Spruce_01

[/Script/PipecatDemo.PipecatObjects]
; The Interaction System from Fab, which the player gets: F to interact, and
; the mouse wheel to choose what to do.
InteractionManager=/Game/InteractionSystem/InteractionSystemV2/InteractionSystemV2/BP_InteractionManager.BP_InteractionManager_C
; What the bot can put in the world, by the names bot.py gives them: a
; Blueprint's class, or a static mesh. Add more, e.g. from Fab, here and in
; OBJECTS in bot.py.
+Kinds=(Name="door",Asset="/Game/InteractionSystem/InteractionSystemV2/Demo/Blueprints/BP_Door.BP_Door_C")
+Kinds=(Name="lever",Asset="/Game/InteractionSystem/InteractionSystemV2/Demo/Blueprints/BP_Lever.BP_Lever_C")
+Kinds=(Name="npc",Asset="/Game/InteractionSystem/InteractionSystemV2/Demo/Blueprints/BP_NPC.BP_NPC_C")
+Kinds=(Name="interactive_box",Asset="/Game/InteractionSystem/InteractionSystemV2/Demo/Blueprints/BP_TestActor_01.BP_TestActor_01_C")
+Kinds=(Name="jump_pad",Asset="/Game/LevelPrototyping/Interactable/JumpPad/BP_JumpPad.BP_JumpPad_C")
+Kinds=(Name="crate",Asset="/Game/LevelPrototyping/Meshes/SM_ChamferCube.SM_ChamferCube")
+Kinds=(Name="ramp",Asset="/Game/LevelPrototyping/Meshes/SM_Ramp.SM_Ramp")
+Kinds=(Name="pillar",Asset="/Game/LevelPrototyping/Meshes/SM_Cylinder.SM_Cylinder",Scale=1.0)
